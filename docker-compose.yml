services:
  caddy:
    build: ./caddy
    container_name: rdoc-webrtc-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CF_API_KEY=your CF API Key
      - CF_API_EMAIL=your Email

  mediamtx-jazzz:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: mediamtx-jazzz
    restart: unless-stopped
    ports:
      - "8891:8891/udp"   # SRT
      - "9991:9991/tcp"   # API
      - "8181:8181/udp"   # WebRTC ICE/Media
    environment:
      - MTX_SRT=yes
      - MTX_SRTADDRESS=:8891
      - MTX_API=yes
      - MTX_APIADDRESS=:9991
      - MTX_RTSP=yes
      - MTX_RTSPADDRESS=:8554
      - MTX_RTMP=no
      - MTX_HLS=no
      - MTX_WEBRTC=yes
      - MTX_WEBRTCADDRESS=:8889
      - MTX_WEBRTCLOCALUDPADDRESS=:8181
      - MTX_WEBRTCADDITIONALHOSTS=85.215.253.135

  mediamtx-headwig:
