      - "8894:8894/udp"   # SRT
      - "9994:9994/tcp"   # API
      - "8184:8189/udp"   # WebRTC ICE/Media
    environment:
      - MTX_SRT=yes
      - MTX_SRTADDRESS=:8894
      - MTX_API=yes
      - MTX_APIADDRESS=:9994
      - MTX_RTSP=no
      - MTX_RTMP=no
      - MTX_HLS=no
      - MTX_WEBRTC=yes
      - MTX_WEBRTCADDRESS=:8889
      - MTX_WEBRTCLOCALUDPADDRESS=:8189
