services:
  mediamtx-jazzz:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx-jazzz
    restart: unless-stopped
    ports:
      - "8891:8891/udp"
      - "9991:9991/tcp"
    environment:
      - MTX_SRT=yes
      - MTX_SRTADDRESS=:8891
      - MTX_API=yes
      - MTX_APIADDRESS=:9991
      - MTX_RTSP=no
      - MTX_RTMP=no
      - MTX_HLS=no
      - MTX_WEBRTC=no
      - MTX_PATHS_JAZZZ_GAME_SOURCE=publisher

  mediamtx-headwig:
